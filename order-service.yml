server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db

app:
  message: Hello, I'm Order Service.

# We want that call to pass through a Circuit Breaker.
spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true

resilience4j:
  circuitbreaker:
    instances:
      ProductClientgetProductById:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
